<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLP Mini Tool</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><h1>Data Loss Prevention Mini Tool</h1><p class="subtitle">Detect sensitive data patterns before files are uploaded or shared.</p><section class="card"><label for="file">Choose a text file</label><input id="file" type="file" accept=".txt,.csv,.log,.json,.md,.xml,.html,.yaml,.yml"><button id="scan">Scan before sharing</button><p class="note">Files are scanned in memory and are not saved by this MVP. Maximum size: 2 MiB.</p></section><section id="result" class="card hidden" aria-live="polite"></section></main><script src="/app.js"></script></body></html>
